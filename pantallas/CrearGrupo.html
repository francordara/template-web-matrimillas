<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1E293B;background:#fff;font-size:14px;line-height:1.5}
a{color:#4F46E5;text-decoration:none} a:hover{text-decoration:underline}
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:12px 32px;border-bottom:1px solid #E2E8F0}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid #E2E8F0;background:#F3F4F6;color:#111827;font:600 14px system-ui,sans-serif;cursor:pointer}
.btn:hover{text-decoration:none;background:#E5E7EB}

h1{margin:0 0 24px;font-size:36px;line-height:1.15;font-weight:700}
label{display:block;font-weight:600;margin-bottom:6px}
input:not([type=radio]):not([type=checkbox]){box-sizing:border-box;width:100%;min-height:44px;padding:8px 12px;border:1px solid #94A3B8;border-radius:6px;font:inherit;color:#1E293B;background:#fff}
.field{display:flex;flex-direction:column;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:400;margin:0}

<style>.volver{position:fixed;right:12px;bottom:12px;background:#1E293B;color:#fff!important;padding:8px 14px;border-radius:999px;font:600 13px system-ui;text-decoration:none;opacity:.85;z-index:9}</style></head><body>


<div style="min-height: 800px">
<header class="nav">
<span class="brand">Matrimillas</span>
<nav class="links">

<main class="wrap">
<h1>Crear un grupo</h1>
<form style="max-width: 520px">
<div class="field"><label for="g-name">Nombre</label><input id="g-name" type="text" value="Depto Palermo"></div>
<fieldset style="border: 0; padding: 0; margin: 0 0 20px">
<legend style="font-weight: 600; padding: 0; margin-bottom: 6px">Cómo se aprueban las acciones</legend>
<label class="opt" for="m-uno"><input id="m-uno" type="radio" name="modo" checked> Alcanza con una persona</label>
<label class="opt" for="m-todos"><input id="m-todos" type="radio" name="modo"> Tienen que aprobar todos</label>
<label class="opt" for="m-arbitro"><input id="m-arbitro" type="radio" name="modo"> Decide un árbitro que va rotando</label>
</fieldset>
<div class="field"><label for="g-deuda">Deuda máxima permitida (puntos)</label><input id="g-deuda" type="number" value="50"></div>
<div class="field"><label for="g-dias">Días para que una acción pendiente expire</label><input id="g-dias" type="number" value="7"></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<a class="btn primary" href="Grupo.html">Crear grupo</a>
<a href="MisGrupos.html">Cancelar</a>
</div>
<p class="muted" style="margin-top: 20px">Vas a ser el primer integrante. Después podés compartir el código de invitación desde el detalle del grupo.</p>
